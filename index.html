<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Evolutionary Grid Simulation</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- TOP BAR -->
  <div id="topbar">
    <div id="topbar-title">Evolutionary Grid Simulation</div>
    <div id="topbar-hud">
      <span>Gen: <strong id="generationCount">0</strong></span>
      <span>Pop: <strong id="populationCount">0</strong></span>
    </div>
    <div id="topbar-btns">
      <button id="startButton">&#9654; Start</button>
      <button id="pauseButton" disabled>&#9646;&#9646; Pause</button>
      <button id="resetButton">&#8635; Reset</button>
      <button id="toggleControls">&#9881; Controls &#9660;</button>
    </div>
  </div>

  <!-- COLLAPSIBLE CONTROLS -->
  <div id="controls-bar" class="collapsed">
    <div id="controls-inner">

      <div class="ctrl-group">
        <div class="slider-container">
          <label for="migrationRateSlider">Migration Rate:</label>
          <input type="range" id="migrationRateSlider" min="0" max="100" value="10" />
          <span id="migrationRateValue">10%</span>
        </div>
        <div class="slider-container">
          <label for="migrationIntervalSlider">Migration Interval:</label>
          <input type="range" id="migrationIntervalSlider" min="10" max="200" step="10" value="50" />
          <span id="migrationIntervalValue">50 gen</span>
        </div>
        <div class="slider-container">
          <label for="speedSlider">Simulation Speed:</label>
          <input type="range" id="speedSlider" min="1" max="20" value="5" />
          <span id="speedValue">Fast</span>
        </div>
      </div>

      <div class="ctrl-group">
        <div class="slider-container autostop-controls">
          <label for="autostopCheckbox">Auto Stop:</label>
          <input type="checkbox" id="autostopCheckbox" />
          <select id="stopConditionDropdown">
            <option value="allFitness100">All Islands Avg Fitness &ge; 100</option>
            <option value="generation500">Generation 500 reached</option>
            <option value="generation1000">Generation 1000 reached</option>
          </select>
        </div>
        <div class="slider-container migration-controls">
          <label>Migration Start Gen:</label>
          <select id="migrationStartGenDropdown">
            <option value="100">100</option>
            <option value="200">200</option>
            <option value="300">300</option>
            <option value="400">400</option>
            <option value="500">500</option>
          </select>
          <label>Replacement:</label>
          <select id="replacementStrategyDropdown">
            <option value="leastFitted">Least Fit</option>
            <option value="random">Random</option>
          </select>
        </div>
      </div>

      <div class="ctrl-group">
        <div id="color-legend">
          <strong>Fitness Spectrum:</strong>
          <div class="spectrum-container">
            <span>Low</span>
            <div class="fitness-gradient"></div>
            <span>High</span>
          </div>
        </div>
        <div id="island-stats">
          <strong>Island Statistics:</strong>
          <div id="island-health-list"><p>Initializing&hellip;</p></div>
        </div>
      </div>

    </div>
  </div>

  <!-- SIMULATION AREA -->
  <div id="simulation-area">
    <div id="grid-wrap">
      <div id="grid-container"></div>
    </div>
  </div>

  <!-- HOVER TOOLTIP -->
  <div id="tooltip"></div>

  <!-- Hidden spans for script.js compatibility -->
  <span id="info-x" style="display:none"></span>
  <span id="info-y" style="display:none"></span>
  <span id="info-age" style="display:none"></span>
  <span id="info-height" style="display:none"></span>
  <span id="info-health" style="display:none"></span>
  <span id="info-water" style="display:none"></span>
  <span id="info-nutrients" style="display:none"></span>
  <span id="info-genome" style="display:none"></span>
  <div id="info-panel" style="display:none"></div>

  <script src="script.js"></script>
  <script>
    var _controlsOpen = false;
    var _toggleBtn   = document.getElementById('toggleControls');
    var _controlsBar = document.getElementById('controls-bar');
    var _topbar      = document.getElementById('topbar');

    _toggleBtn.addEventListener('click', function() {
      _controlsOpen = !_controlsOpen;
      _controlsBar.classList.toggle('collapsed', !_controlsOpen);
      _toggleBtn.innerHTML = _controlsOpen
        ? '&#9881; Controls &#9650;'
        : '&#9881; Controls &#9660;';
      _scaleGrid();
    });

    function _scaleGrid() {
      requestAnimationFrame(function() {
        var gc = document.getElementById('grid-container');

        // 1. Reset transform so offsetWidth/Height give the natural size
        gc.style.transform = 'none';
        gc.style.marginLeft = '0';

        var naturalW = gc.offsetWidth;
        var naturalH = gc.offsetHeight;
        if (naturalW === 0 || naturalH === 0) return;

        // 2. Available space
        var usedH = _topbar.offsetHeight
                  + (_controlsOpen ? _controlsBar.offsetHeight : 0)
                  + 20;
        var availW = window.innerWidth  - 20;
        var availH = window.innerHeight - usedH;

        // 3. Uniform scale
        var scale = Math.min(availW / naturalW, availH / naturalH, 1);

        // 4. After scaling from top-left, the grid visually occupies
        //    naturalW*scale wide but still takes naturalW in layout.
        //    Shift it right by half the difference to center it.
        var scaledW = naturalW * scale;
        var offsetX = (availW - scaledW) / 2;

        gc.style.transformOrigin = 'top left';
        gc.style.transform = 'scale(' + scale + ')';
        gc.style.marginLeft = offsetX + 'px';
      });
    }

    window.addEventListener('resize', _scaleGrid);

    var _gridPoll = setInterval(function() {
      var gc = document.getElementById('grid-container');
      if (gc && gc.children.length > 0) {
        clearInterval(_gridPoll);
        _scaleGrid();
      }
    }, 100);

    // Floating tooltip
    var _tooltip = document.getElementById('tooltip');
    document.getElementById('grid-container').addEventListener('mouseover', function(e) {
      var cell = e.target.closest ? e.target.closest('.grid-cell') : null;
      if (!cell) return;
      var ix = document.getElementById('info-x').textContent;
      if (ix === '') return;
      _tooltip.innerHTML =
        '<b>X:</b> ' + ix + ' &nbsp; <b>Y:</b> ' + document.getElementById('info-y').textContent + '<br>' +
        '<b>Age:</b> ' + document.getElementById('info-age').textContent +
        ' &nbsp; <b>Height:</b> ' + document.getElementById('info-height').textContent + '<br>' +
        '<b>Health:</b> ' + document.getElementById('info-health').textContent + '<br>' +
        '<b>Water:</b> ' + document.getElementById('info-water').textContent +
        ' &nbsp; <b>Nutrients:</b> ' + document.getElementById('info-nutrients').textContent + '<br>' +
        '<b>Genome:</b> ' + document.getElementById('info-genome').textContent;
      _tooltip.style.display = 'block';
    });
    document.getElementById('grid-container').addEventListener('mousemove', function(e) {
      _tooltip.style.left = (e.clientX + 14) + 'px';
      _tooltip.style.top  = (e.clientY - 10) + 'px';
    });
    document.getElementById('grid-container').addEventListener('mouseleave', function() {
      _tooltip.style.display = 'none';
    });
  </script>
</body>
</html>
