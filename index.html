<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Evolutionary Grid Simulation</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- TOP BAR -->
  <div id="topbar">
    <div id="topbar-title">Evolutionary Grid Simulation</div>
    <div id="topbar-hud">
      <span>Gen: <strong id="generationCount">0</strong></span>
      <span>Pop: <strong id="populationCount">0</strong></span>
    </div>
    <div id="topbar-btns">
      <button id="startButton">&#9654; Start</button>
      <button id="pauseButton" disabled>&#9646;&#9646; Pause</button>
      <button id="resetButton">&#8635; Reset</button>
      <button id="toggleControls">&#9881; Controls &#9660;</button>
    </div>
  </div>

  <!-- COLLAPSIBLE CONTROLS -->
  <div id="controls-bar" class="collapsed">
    <div id="controls-inner">

      <div class="ctrl-group">
        <div class="slider-container">
          <label for="migrationRateSlider">Migration Rate:</label>
          <input type="range" id="migrationRateSlider" min="0" max="100" value="10" />
          <span id="migrationRateValue">10%</span>
        </div>
        <div class="slider-container">
          <label for="migrationIntervalSlider">Migration Interval:</label>
          <input type="range" id="migrationIntervalSlider" min="10" max="200" step="10" value="50" />
          <span id="migrationIntervalValue">50 gen</span>
        </div>
        <div class="slider-container">
          <label for="speedSlider">Simulation Speed:</label>
          <input type="range" id="speedSlider" min="1" max="20" value="5" />
          <span id="speedValue">Fast</span>
        </div>
      </div>

      <div class="ctrl-group">
        <div class="slider-container autostop-controls">
          <label for="autostopCheckbox">Auto Stop:</label>
          <input type="checkbox" id="autostopCheckbox" />
          <select id="stopConditionDropdown">
            <option value="allFitness100">All Islands Avg Fitness &ge; 100</option>
            <option value="generation500">Generation 500 reached</option>
            <option value="generation1000">Generation 1000 reached</option>
          </select>
        </div>
        <div class="slider-container migration-controls">
          <label>Migration Start Gen:</label>
          <select id="migrationStartGenDropdown">
            <option value="100">100</option>
            <option value="200">200</option>
            <option value="300">300</option>
            <option value="400">400</option>
            <option value="500">500</option>
          </select>
          <label>Replacement:</label>
          <select id="replacementStrategyDropdown">
            <option value="leastFitted">Least Fit</option>
            <option value="random">Random</option>
          </select>
        </div>
      </div>

      <div class="ctrl-group">
        <div id="color-legend">
          <strong>Fitness Spectrum:</strong>
          <div class="spectrum-container">
            <span>Low</span>
            <div class="fitness-gradient"></div>
            <span>High</span>
          </div>
        </div>
        <div id="island-stats">
          <strong>Island Statistics:</strong>
          <div id="island-health-list"><p>Initializing&hellip;</p></div>
        </div>
      </div>

    </div>
  </div>

  <!-- SIMULATION AREA -->
  <div id="simulation-area">
    <div id="grid-wrap">
      <div id="grid-container"></div>
    </div>
  </div>

  <!-- HOVER TOOLTIP (replaces info panel) -->
  <div id="tooltip"></div>

  <!-- Hidden spans kept for script.js compatibility -->
  <span id="info-x" style="display:none"></span>
  <span id="info-y" style="display:none"></span>
  <span id="info-age" style="display:none"></span>
  <span id="info-height" style="display:none"></span>
  <span id="info-health" style="display:none"></span>
  <span id="info-water" style="display:none"></span>
  <span id="info-nutrients" style="display:none"></span>
  <span id="info-genome" style="display:none"></span>
  <div id="info-panel" style="display:none"></div>

  <script src="script.js"></script>
  <script>
    // Collapsible controls toggle
    const toggleBtn = document.getElementById('toggleControls');
    const controlsBar = document.getElementById('controls-bar');
    let open = false;
    toggleBtn.addEventListener('click', () => {
      open = !open;
      controlsBar.classList.toggle('collapsed', !open);
      toggleBtn.innerHTML = open ? '&#9881; Controls &#9650;' : '&#9881; Controls &#9660;';
      scaleGrid();
    });

    // Scale grid to fit available area
    const gridWrap = document.getElementById('grid-wrap');
    const gridContainer = document.getElementById('grid-container');
    function scaleGrid() {
      // Use rAF to let layout settle after any controls toggle
      requestAnimationFrame(() => {
        const availW = gridWrap.clientWidth;
        const availH = gridWrap.clientHeight;
        const gridW = gridContainer.scrollWidth;
        const gridH = gridContainer.scrollHeight;
        if (gridW === 0 || gridH === 0) return;
        const scale = Math.min(availW / gridW, availH / gridH, 1);
        gridContainer.style.transformOrigin = 'top left';
        gridContainer.style.transform = `scale(${scale})`;
        // Shrink wrapper to match scaled size so centering works
        gridContainer.parentElement.style.width  = (gridW * scale) + 'px';
        gridContainer.parentElement.style.height = (gridH * scale) + 'px';
      });
    }

    // Re-scale on resize and after grid is created
    window.addEventListener('resize', scaleGrid);
    // Poll until grid cells exist then scale
    const waitForGrid = setInterval(() => {
      if (gridContainer.children.length > 0) {
        clearInterval(waitForGrid);
        scaleGrid();
      }
    }, 100);

    // Floating tooltip: intercept the existing mouseenter/mouseleave on cells
    const tooltip = document.getElementById('tooltip');
    gridContainer.addEventListener('mouseover', e => {
      const cell = e.target.closest('.grid-cell');
      if (!cell) return;
      const x = cell.dataset.x, y = cell.dataset.y;
      const ix = document.getElementById('info-x').textContent;
      const iy = document.getElementById('info-y').textContent;
      // Only show if script populated the hidden spans (i.e. it's a tree)
      if (ix === '' && iy === '') return;
      tooltip.innerHTML =
        `<b>X:</b> ${document.getElementById('info-x').textContent} &nbsp; <b>Y:</b> ${document.getElementById('info-y').textContent}<br>` +
        `<b>Age:</b> ${document.getElementById('info-age').textContent} &nbsp; <b>Height:</b> ${document.getElementById('info-height').textContent}<br>` +
        `<b>Health:</b> ${document.getElementById('info-health').textContent}<br>` +
        `<b>Water:</b> ${document.getElementById('info-water').textContent} &nbsp; <b>Nutrients:</b> ${document.getElementById('info-nutrients').textContent}<br>` +
        `<b>Genome:</b> ${document.getElementById('info-genome').textContent}`;
      tooltip.style.display = 'block';
    });
    gridContainer.addEventListener('mousemove', e => {
      tooltip.style.left = (e.clientX + 14) + 'px';
      tooltip.style.top  = (e.clientY - 10) + 'px';
    });
    gridContainer.addEventListener('mouseleave', () => {
      tooltip.style.display = 'none';
    });
  </script>
</body>
</html>
